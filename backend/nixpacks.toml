[setup]
phpVersion = '8.2'

[install]
cmds = ['composer install --ignore-platform-reqs --no-scripts']

[build]
cmds = ['composer dump-autoload --optimize', 'curl -L https://github.com/roadrunner-server/roadrunner/releases/download/v2025.1.8/roadrunner-2025.1.8-linux-amd64.tar.gz -o /tmp/rr.tar.gz && tar -xzf /tmp/rr.tar.gz -C /tmp && mv /tmp/roadrunner-2025.1.8-linux-amd64/rr ./rr && chmod +x ./rr']