[setup]
phpVersion = '8.2'

[install]
cmds = ['install-php-extensions zip curl pdo_mysql bcmath xml mbstring pdo ctype curl dom fileinfo filter hash mbstring openssl pcre pdo session tokenizer xml pdo_mysql sockets pcntl posix', 'composer install --ignore-platform-reqs --no-scripts']

[build]
cmds = ['composer dump-autoload --optimize']